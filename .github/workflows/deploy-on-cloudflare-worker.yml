name: Deploy on Cloudflare Worker

concurrency:
  group: deploy-on-cloudflare-worker
  cancel-in-progress: true

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check-enabled.outputs.enabled }}
    steps:
      - name: Check if vars.DEPLOY_TYPE is set to 'cloudflare-worker'
        id: check-enabled
        run: |
          if [ "${{ vars.DEPLOY_TYPE }}" == "cloudflare-worker" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: needs.check.outputs.enabled == 'true'
    name: Deploy
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_CONNECION_STRING: ${{ secrets.DB_CONNECION_STRING }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DB_TYPE: ${{ vars.DB_TYPE }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Deploy
        run: |
          cd server
          pnpm install
          pnpm run deploy
